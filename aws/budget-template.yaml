AWSTemplateFormatVersion: '2010-09-09'
Description: Monthly Kisero boat archive cost alert (AWS Budgets is managed in us-east-1)
Parameters:
  BudgetAlertEmail:
    Type: String
    Description: Email address for actual-spend notifications
  MonthlyBudgetLimitUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Alert threshold in USD; this does not cap spending
Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: kisero-boat-monthly-cost-alert
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimitUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
